[package]
name = "gossip-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "Joins Solana gossip and measures how much arrives versus the leader contact-info changes the sidecar needs"

# Standalone: not part of any parent workspace.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = "3"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
serde_json = "1"
# Same Agave release as mainnet Jito 4.4.1. Bump all three together.
solana-gossip = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-net-utils = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-rpc-client = "=4.4.1"
solana-keypair = "4.0.0"
solana-pubkey = "4.3.0"

[profile.release]
debug = 1

# Agave 4.4.1's own patches (its workspace Cargo.toml). The crates.io solana-ledger is written
# against Anza's rust-rocksdb fork (`new_pinnable_slice`, `get_pinned_cf_into`, …), so the stock
# rocksdb from crates.io doesn't compile with it. Keep these revs in step with the Agave version.
[patch.crates-io]
blstrs = { git = "https://github.com/anza-xyz/blstrs", rev = "a1faffa3420bdaf4102425c43f00cdd815d4f145" }
crossbeam-epoch = { git = "https://github.com/anza-xyz/crossbeam", rev = "5ee1c6ec671d94db14ed9238eb99e59a84555aad" }
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rustls-webpki = { git = "https://github.com/anza-xyz/rustls-webpki", tag = "anza-0.103.10-2" }
rustls-webpki2 = { git = "https://github.com/anza-xyz/rustls-webpki", package = "rustls-webpki", tag = "anza-0.101.7-2" }
